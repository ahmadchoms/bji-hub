name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, Lint & Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: biji_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATA_SOURCE: mock
      NODE_ENV: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: TypeScript Check
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: UI Accessibility Rules Check
        run: npm run lint:ui

      - name: Codebase Invariants Check
        run: npm run lint:invariants

      - name: Audit Production Dependencies
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: Deploy Prisma Migrations on Test DB (R2)
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/biji_test

      - name: Vitest Suite (Unit & Postgres Contract Tests)
        run: npm test
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/biji_test
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/biji_test

      - name: Next.js Production Build Test
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          DATA_SOURCE: mock
          ALLOW_MOCK_AUTH: "true"
          NEXT_PUBLIC_SUPABASE_URL: "https://mock-project.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "mock-anon-key-for-ci-build"
